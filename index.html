
  <!DOCTYPE html>
  <html lang="en" class="dark">
    <head>
      <meta charset="UTF-8" />
    
    <!-- Mobile Friendly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#0c0b0a" />
    
    <!-- Fonts are self-hosted (src/styles/fonts.css); preload the two display cuts used above the fold -->
    <link rel="preload" href="/fonts/bodoni-moda-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bodoni-moda-italic-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Basic SEO -->
    <title>Nitesh Joshi | Computer Engineering Student, Developer & Poet</title>
    <meta name="description" content="Computer Engineering student from Nepal passionate about AI/ML, open source, and building meaningful digital experiences." />
    <meta name="robots" content="index, follow" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph (LinkedIn, Facebook) -->
    <meta property="og:title" content="Nitesh Joshi | Engineer & Poet" />
    <meta property="og:description" content="Portfolio of Nitesh Joshi – Computer Engineering student, developer, and AI/ML enthusiast." />
    <meta property="og:image" content="https://niteshjoshi.me/og-image.png" />
    <meta property="og:url" content="https://niteshjoshi.me" />
    <meta property="og:type" content="website" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nitesh Joshi | Engineer & Poet" />
    <meta name="twitter:description" content="Computer Engineering student & developer building clean, meaningful experiences." />
    <meta name="twitter:image" content="https://niteshjoshi.me/og-image.png" />
    
    <!-- Additional SEO -->
    <meta name="author" content="Nitesh Joshi" />
    <meta name="keywords" content="Nitesh Joshi, Computer Engineering, AI/ML, Developer, Portfolio, Nepal, Web Development" />
    <link rel="canonical" href="https://niteshjoshi.me" />
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
